<title>Kanban Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: a status line on top, one filter row, then four equal columns of
   cards. A card opens in a dialog. Under 720px the columns become tabs. */
:root {
  --bg: #f1f4f3;
  --surface: #ffffff;
  --surface-2: #e8edeb;
  --ink: #15201e;
  --muted: #586764;
  --line: #d6dedb;
  --accent: #0f766e;
  --accent-ink: #ffffff;
  --accent-soft: #d9efeb;
  --stale: #a85a06;
  --stale-soft: #fbecd3;
  --cold: #2a62a6;
  --cold-soft: #dde9f8;
  --danger: #b3261e;
  --shadow: 0 1px 2px rgba(21, 32, 30, .06), 0 4px 14px rgba(21, 32, 30, .05);
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-head: "Space Grotesk", "Inter", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1413; --surface: #171f1e; --surface-2: #1f2a28; --ink: #e5ecea; --muted: #93a29f;
    --line: #2b3836; --accent: #4fc3b5; --accent-ink: #06201d; --accent-soft: #143531;
    --stale: #e3a552; --stale-soft: #3a2a10; --cold: #86b6ea; --cold-soft: #17283d; --danger: #f2877f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1413; --surface: #171f1e; --surface-2: #1f2a28; --ink: #e5ecea; --muted: #93a29f;
  --line: #2b3836; --accent: #4fc3b5; --accent-ink: #06201d; --accent-soft: #143531;
  --stale: #e3a552; --stale-soft: #3a2a10; --cold: #86b6ea; --cold-soft: #17283d; --danger: #f2877f;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 14px; line-height: 1.45;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1500px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
h1 { font-family: var(--font-head); font-size: 24px; font-weight: 600; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.status { color: var(--muted); font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.status b { color: var(--ink); font-weight: 600; }
.status .warn b { color: var(--stale); }
.note { color: var(--stale); }

/* Filter row */
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 320px; min-width: 0; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 4px 11px; font-size: 13px; white-space: nowrap; max-width: 100%;
  overflow: hidden; text-overflow: ellipsis;
}
.chip .n { color: var(--muted); margin-left: 5px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .7; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  padding: 6px 10px; width: 190px; max-width: 100%;
}
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  padding: 6px 12px; font-weight: 500;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
#stale-toggle[aria-pressed="true"] { background: var(--stale-soft); border-color: var(--stale); color: var(--stale); }
.btn.small { padding: 3px 9px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: default; }

/* Tabs (phones only) */
.tabs { display: none; gap: 6px; }
.tab {
  flex: 1 1 0; min-width: 0; border: 1px solid var(--line); background: var(--surface);
  border-radius: 8px; padding: 7px 4px; font-weight: 500; font-size: 13px;
}
.tab .n { color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tab[aria-selected="true"] .n { color: inherit; opacity: .7; }

/* Columns */
.cols { display: grid; grid-template-columns: repeat(var(--ncols, 4), minmax(0, 1fr)); gap: 12px; align-items: start; }
.col.closed { opacity: .82; }
.col { background: var(--surface-2); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 120px; }
.col.over { outline: 2px dashed var(--accent); outline-offset: -2px; }
.col h2 {
  font-family: var(--font-head); font-size: 12.5px; font-weight: 600; letter-spacing: .08em;
  text-transform: uppercase; margin: 2px 4px 2px; color: var(--muted); display: flex; gap: 8px; align-items: baseline;
}
.col h2 .n { font-variant-numeric: tabular-nums; font-weight: 500; letter-spacing: 0; }
.col .empty { color: var(--muted); font-size: 13px; padding: 10px 6px 14px; }

/* Card */
.card {
  display: flex; flex-direction: column; gap: 6px; text-align: left; width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 10px 12px; box-shadow: var(--shadow); min-width: 0; cursor: pointer;
}
.card:hover { border-color: var(--muted); }
.card.stale { border-color: var(--stale); }
.card.cold { border-color: var(--cold); }
.card.dragging { opacity: .4; }
.card.changed { outline: 2px solid var(--accent); outline-offset: -1px; }
.badge.chg { background: var(--accent); color: var(--accent-ink); }
.card .from { font-size: 12px; color: var(--accent); font-weight: 500; margin-top: -3px; }
.changes { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.changes .btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.changes .btn { color: var(--ink); }
.removed { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 8px 12px; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.removed b { color: var(--ink); font-weight: 600; }
.dlg .chg-note { color: var(--accent); font-weight: 600; }
.card .t { font-weight: 600; font-size: 14.5px; line-height: 1.3; overflow-wrap: anywhere; display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
.card .t span:first-child { min-width: 0; }
.badge { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; background: var(--accent-soft); color: var(--accent); border-radius: 5px; padding: 2px 6px; flex: none; }
.card .s { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .nx { font-size: 13px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .nx b { font-weight: 600; color: var(--accent); }
.card .f { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; justify-content: space-between; margin-top: 2px; }
.repos { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.repo { font-size: 11.5px; color: var(--muted); background: var(--surface-2); border-radius: 5px; padding: 1px 6px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.age { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; margin-left: auto; border-radius: 5px; padding: 1px 6px; }
.age.stale { background: var(--stale-soft); color: var(--stale); font-weight: 600; }
.age.cold { background: var(--cold-soft); color: var(--cold); font-weight: 600; }

/* Page states */
.state { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 28px 20px; text-align: center; color: var(--muted); }
.state strong { display: block; color: var(--ink); font-family: var(--font-head); font-size: 17px; margin-bottom: 4px; }
.state code { font-family: var(--font-mono); font-size: 13px; background: var(--surface-2); padding: 1px 6px; border-radius: 5px; color: var(--ink); }

/* Dialog */
dialog {
  border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink);
  padding: 0; width: min(680px, calc(100vw - 24px)); max-height: min(88vh, 900px); box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
}
dialog::backdrop { background: rgba(10, 16, 15, .5); }
.dlg { display: flex; flex-direction: column; gap: 14px; padding: 18px 20px 20px; }
.dlg header { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.dlg h3 { font-family: var(--font-head); font-size: 19px; font-weight: 600; margin: 0; overflow-wrap: anywhere; text-wrap: balance; }
.dlg .sub { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.x { border: 0; background: transparent; font-size: 22px; line-height: 1; padding: 2px 6px; border-radius: 6px; color: var(--muted); }
.x:hover { background: var(--surface-2); }
.sec { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.sec > label, .sec > .lab { font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.sec p { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.sec .none { color: var(--muted); }
.next-box { background: var(--accent-soft); border-radius: 8px; padding: 9px 12px; }
.next-box p { font-weight: 500; }
.field { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 7px 10px; width: 100%; }
textarea.field { resize: vertical; min-height: 60px; }
.move { display: flex; flex-wrap: wrap; gap: 6px; }
.move .btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.log li { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 10px; }
.log .d { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12.5px; padding-top: 1px; }
.log .x2 { overflow-wrap: anywhere; }
.rows { display: flex; flex-direction: column; gap: 5px; }
.row { display: flex; gap: 8px; align-items: center; justify-content: space-between; min-width: 0; }
.row .grow { min-width: 0; overflow-wrap: anywhere; }
.row .grow small { color: var(--muted); font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-size: 12.5px; overflow-wrap: anywhere; }
a { color: var(--accent); }
.acts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 14px; }
.acts .left, .acts .right { display: flex; gap: 8px; flex-wrap: wrap; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); border-radius: 8px; padding: 8px 14px; font-size: 13px;
  max-width: calc(100vw - 32px); z-index: 50;
}

@media (max-width: 720px) {
  .tabs { display: flex; }
  .cols { grid-template-columns: minmax(0, 1fr); }
  .col { display: none; }
  .col.active { display: flex; }
  .col h2 { display: none; }
  .search { flex: 1 1 140px; width: auto; }
  .log li { grid-template-columns: 1fr; gap: 0; }
}
@media (prefers-reduced-motion: no-preference) {
  .card { transition: border-color .12s; }
}
</style>

<div class="wrap">
  <div class="top">
    <h1 id="board-title">Kanban</h1>
    <div class="status" id="status" aria-live="polite"></div>
  </div>

  <div class="bar" id="bar" hidden>
    <div class="chips" id="chips" role="group" aria-label="Filter by repo"></div>
    <div class="tools">
      <input class="search" id="search" type="search" placeholder="Search cards" aria-label="Search cards">
      <button class="btn" id="stale-toggle" type="button" aria-pressed="false">Stale</button>
      <button class="btn" id="archived-toggle" type="button" aria-pressed="false" title="Show the Won't do and Archived columns">Closed</button>
      <button class="btn primary" id="add-btn" type="button" hidden>+ Add card</button>
    </div>
  </div>

  <div class="tabs" id="tabs" role="tablist" aria-label="Columns" hidden></div>
  <div class="state" id="state"><strong>Loading the board</strong>Reading the cards.</div>
  <div class="removed" id="removed" hidden></div>
  <div class="cols" id="cols" hidden></div>
</div>

<dialog id="card-dlg" aria-labelledby="dlg-title"></dialog>
<dialog id="add-dlg" aria-labelledby="add-title">
  <form class="dlg" id="add-form">
    <header><h3 id="add-title">Add a card</h3><button class="x" type="button" id="add-close" aria-label="Close">×</button></header>
    <div class="sec"><label for="add-name">Title</label><input class="field" id="add-name" maxlength="80" required autocomplete="off"></div>
    <div class="sec"><label for="add-status">Column</label>
      <select class="field" id="add-status"><option value="idea">Ideas</option><option value="todo">Todo</option><option value="doing">Doing</option></select></div>
    <div class="sec"><label for="add-next">Next step</label><input class="field" id="add-next" maxlength="200" autocomplete="off"></div>
    <div class="sec"><label for="add-notes">Notes</label><textarea class="field" id="add-notes" rows="3"></textarea></div>
    <div class="acts"><div class="left"></div><div class="right"><button class="btn primary" type="submit" id="add-save">Add card</button></div></div>
  </form>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  "use strict";
  var PAGE_VERSION = 4;
  var SEEN_AFTER_MS = 10000;  // the page counts as seen after 10 s on screen
  var COLUMNS = [
    { key: "idea", label: "Ideas", empty: "No ideas parked here." },
    { key: "todo", label: "Todo", empty: "Nothing is queued." },
    { key: "doing", label: "Doing", empty: "Nothing is in progress." },
    { key: "done", label: "Done", empty: "Nothing is finished yet." },
    { key: "dropped", label: "Won't do", empty: "Nothing was dropped.", closed: true },
    { key: "archived", label: "Archived", empty: "The archive is empty.", closed: true }
  ];
  // Won't do and Archived are closed: hidden until the "Closed" switch is on.
  function isClosed(status) { return status === "dropped" || status === "archived"; }
  var DAY = 86400000;

  var S = {
    db: null, canEdit: false, cards: [], meta: {}, loaded: false, slow: false, dead: null,
    repo: "", query: "", staleOnly: false, showArchived: false, tab: "doing",
    openId: null, dirty: false, base: null, openJson: "", openChange: null,
    // What this viewer has seen: `seenBase` is the copy this visit compares with,
    // `copy` mirrors the stored copy. See the "seen" section below.
    uid: null, seenKnown: false, seenLocal: false, seenBase: null, seenAt: "", copy: null, copyExists: false, copyDirty: false, remote: null,
    seenTimer: null, diff: null, changesOnly: false
  };
  var el = function (id) { return document.getElementById(id); };
  var queues = {};

  // ---- seen:begin
  // "What changed since you last looked": the board now against the viewer's
  // copy of the board as they last saw it. Pure functions, no DOM; the tests
  // cut this block out and run it in Node (tests/test_board_seen.py).
  // A copy entry: t title, s status, h and n hashes of summary and next step,
  // x the id of the newest session. A null entry is a card the viewer removed.
  function fnv(s) {
    var h = 0x811c9dc5;
    s = typeof s === "string" ? s : "";
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return ("0000000" + (h >>> 0).toString(16)).slice(-8);
  }
  function entryOf(c) {
    var t = function (v) { return typeof v === "string" ? v : ""; };
    var first = Array.isArray(c.sessions) && c.sessions[0] && typeof c.sessions[0] === "object" ? c.sessions[0] : {};
    return { t: t(c.title), s: t(c.status), h: fnv(c.summary), n: fnv(c.next_step), x: t(first.id) };
  }
  function snapshotOf(cards) {
    var out = {};
    cards.forEach(function (c) { out[c.id] = entryOf(c); });
    return out;
  }
  function diffBoard(base, cards) {
    var d = { byId: {}, removed: [], counts: { "new": 0, moved: 0, renamed: 0, updated: 0, removed: 0 }, total: 0 };
    if (!base || typeof base !== "object") return d;
    var here = {};
    cards.forEach(function (c) {
      here[c.id] = true;
      var was = base[c.id], now = entryOf(c), kinds = [];
      if (!was || typeof was !== "object") kinds.push("new");
      else {
        if (was.s !== now.s) kinds.push("moved");
        if (was.t !== now.t) kinds.push("renamed");
        if (was.h !== now.h || was.n !== now.n || was.x !== now.x) kinds.push("updated");
      }
      if (!kinds.length) return;
      d.byId[c.id] = { kinds: kinds, from: kinds[0] === "new" ? "" : String(was.s || "") };
      kinds.forEach(function (k) { d.counts[k]++; });
      d.total++;
    });
    Object.keys(base).forEach(function (id) {
      var was = base[id];
      if (here[id] || !was || typeof was !== "object") return;
      d.removed.push({ id: id, title: typeof was.t === "string" ? was.t : "" });
      d.counts.removed++;
      d.total++;
    });
    return d;
  }
  // `card` (optional): the card as it is now. A patch for a card the base does
  // not know starts from that card, so the other fields do not read as changed.
  function patchBase(base, id, patch, card) {
    if (patch === null) { base[id] = null; return; }
    var old = base[id] && typeof base[id] === "object" ? base[id] : card ? entryOf(card) : {};
    base[id] = Object.assign({}, old, patch);
  }
  // ---- seen:end

  // ---------- small helpers ----------
  function h(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === "text") n.textContent = v;
      else if (k === "class") n.className = v;
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  function str(v) { return typeof v === "string" ? v : ""; }
  function arr(v) { return Array.isArray(v) ? v : []; }
  function time(v) { var t = Date.parse(str(v)); return isNaN(t) ? 0 : t; }
  function days(v) { var t = time(v); return t ? Math.max(0, Math.floor((Date.now() - t) / DAY)) : null; }
  function ago(v) {
    var t = time(v); if (!t) return "";
    var m = Math.max(0, Math.round((Date.now() - t) / 60000));
    if (m < 1) return "just now";
    if (m < 60) return m + " min ago";
    if (m < 60 * 36) return Math.round(m / 60) + " h ago";
    return Math.round(m / 1440) + " days ago";
  }
  function ageLabel(v) {
    var d = days(v);
    if (d === null) return "";
    if (d === 0) return "today";
    if (d === 1) return "yesterday";
    return d + " days";
  }
  function dateLabel(v) {
    var t = time(v); if (!t) return str(v);
    return new Date(t).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }
  function staleness(c) {
    if (c.status !== "todo" && c.status !== "doing") return "";
    var d = days(c.last_touched);
    if (d === null) return "";
    var cold = Number(S.meta.cold_days) || 30, stale = Number(S.meta.stale_days) || 14;
    return d >= cold ? "cold" : d >= stale ? "stale" : "";
  }
  function sortKey(c) {
    return typeof c.order === "number" ? c.order : -(time(c.last_touched) || time(c.created)) / 1000;
  }
  function safeUrl(u) { return /^https?:\/\//i.test(str(u)) ? u : null; }
  function toast(msg) {
    var t = el("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toast.timer); toast.timer = setTimeout(function () { t.hidden = true; }, 3500);
  }
  function pref(key, val) {
    try {
      if (val === undefined) return localStorage.getItem("kanban." + key);
      localStorage.setItem("kanban." + key, val);
    } catch (e) { /* storage is optional */ }
    return null;
  }

  // ---------- writes: one at a time per card ----------
  // Resolves true when the write was stored, false when it was refused or failed.
  function write(id, fn) {
    var prev = queues[id] || Promise.resolve();
    var next = prev.then(fn).then(function () { return true; }, function (e) {
      if (e && e.code === "invalid_argument") toast("You can't change this board.");
      else if (e && e.code === "quota_exceeded") toast("The board is full. Delete or archive cards.");
      else toast("That change was not saved. Try again.");
      return false;
    });
    queues[id] = next;
    return next;
  }
  function updateCard(id, fields) {

           : h("h3", { id: "dlg-title", text: str(c.title) || "Untitled" }),

    d.replaceChildren(h("div", { class: "dlg" }, body.filter(Boolean)));
  }
  function dirty() { S.dirty = true; var b = el("dlg-save"); if (b) b.disabled = false; }
  function saveDialog() {
    var c = byId(S.openId), base = S.base; if (!c || !base) return;
    var id = c.id, f = {}, now = new Date().toISOString();
    var title = el("dlg-title").value.trim(), next = el("dlg-next").value.trim(), notes = el("dlg-notes").value;
    if (title && title !== base.title) f.title = title;
    if (next !== base.next_step.trim()) { f.next_step = next; f.next_step_edited_at = now; }
    if (notes !== base.notes) f.notes = notes;
    var b = el("dlg-save"); if (b) b.disabled = true;
    if (!Object.keys(f).length) { S.dirty = false; return; }
    var patch = {};
    if (f.title) patch.t = f.title;
    if ("next_step" in f) patch.n = fnv(f.next_step);
    if (Object.keys(patch).length) ownEdit(id, patch);
    // The typed text stays in the fields (dirty stays true) until the write is confirmed.
    updateCard(id, f).then(function (ok) {
      if (ok && Object.keys(patch).length) saveOwnEdit(id, patch);
      if (S.openId !== id) { if (ok) toast("Saved."); return; }
      if (ok) { S.dirty = false; toast("Saved."); renderDialog(); }
      else { var again = el("dlg-save"); if (again) again.disabled = false; }
    });
  }
  function copy(text, btn) {
    var done = function () { var t = btn.textContent; btn.textContent = "Copied"; setTimeout(function () { btn.textContent = t; }, 1500); };
    try { navigator.clipboard.writeText(text).then(done, function () { toast(text); }); }
    catch (e) { toast(text); }
  }

  // ---------- add a card ----------
  function slug(s) {
    var base = s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40) || "card";
    var r = "", abc = "abcdefghijkmnpqrstuvwxyz23456789";
    for (var i = 0; i < 4; i++) r += abc[Math.floor(Math.random() * abc.length)];
    return base + "-" + r;
  }
  function addCard(e) {
    e.preventDefault();
    var title = el("add-name").value.trim(); if (!title) return;
    var now = new Date().toISOString(), id = slug(title), next = el("add-next").value.trim();
    var doc = {
      title: title, status: el("add-status").value, summary: "", next_step: next, notes: el("add-notes").value,
      log: [], repos: [], folders: [], links: [], sessions: [],
      created: now, last_touched: now, status_changed_at: now, is_new: false
    };
    if (next) doc.next_step_edited_at = now;
    el("add-dlg").close(); el("add-form").reset();
    var entry = entryOf(Object.assign({ id: id }, doc));
    ownEdit(id, entry);
    write(id, function () { return S.db.collection("cards").doc(id).set(doc); }).then(function (ok) {
      S.tab = doc.status;
      if (ok) saveOwnEdit(id, entry);
    });
  }

  // ---------- wiring ----------
  el("search").addEventListener("input", function (e) { S.query = e.target.value; render(); });
  el("stale-toggle").addEventListener("click", function (e) { S.staleOnly = !S.staleOnly; e.currentTarget.setAttribute("aria-pressed", String(S.staleOnly)); render(); });
  el("archived-toggle").addEventListener("click", function (e) { S.showArchived = !S.showArchived; e.currentTarget.setAttribute("aria-pressed", String(S.showArchived)); render(); });
  el("add-btn").addEventListener("click", function () { el("add-dlg").showModal(); el("add-name").focus(); });
  el("add-close").addEventListener("click", function () { el("add-dlg").close(); });
  el("add-form").addEventListener("submit", addCard);
  el("card-dlg").addEventListener("close", function () { S.openId = null; S.openChange = null; S.dirty = false; S.base = null; });
  // Esc or a click outside does not throw typed text away. The x button does.
  el("card-dlg").addEventListener("cancel", function (e) {
    if (S.dirty) { e.preventDefault(); toast("Unsaved changes. Save them, or close with x to discard."); }
  });
  [el("card-dlg"), el("add-dlg")].forEach(function (d) {
    d.addEventListener("click", function (e) {
      if (e.target !== d) return;
      if (d.id === "card-dlg" && S.dirty) { toast("Unsaved changes. Save them, or close with x to discard."); return; }
      d.close();
    });
  });
  S.repo = pref("repo") || "";
  S.tab = pref("tab") || "doing";
  setInterval(function () { if (S.loaded && !S.dead) { renderStatus(); } }, 60000);
  document.addEventListener("visibilitychange", armSeenTimer);

  async function start() {
    render();
    var claude = window.claude;
    if (!claude || typeof claude.use !== "function") {
      S.dead = ["This page needs claude.ai", "Open the board from its claude.ai link to see the cards."]; render(); return;
    }
    var got = await Promise.all([claude.use("db"), claude.use("user")]);
    var db = got[0], user = got[1];
    if (!db) {
      S.dead = ["The cards can't be shown here", "Sign in to claude.ai and open the board again."]; render(); return;
    }
    S.db = db;
    try { S.canEdit = user ? !!(await user.canEdit()) : false; } catch (e) { S.canEdit = false; }
    loadSeen(user);

    // Loading is time-limited: after 10 s, say so and keep listening.
    var timer = setTimeout(function () { S.slow = true; render(); }, 10000);
    function settled(meta) { if (!meta || !meta.fromCache) { clearTimeout(timer); S.slow = false; } }
    function failed(e) {
      clearTimeout(timer);
      S.dead = e && e.code === "revoked"
        ? ["The board is no longer shared with you", "Ask its owner for access."]
        : ["The cards can't be read right now", "Reload the page to try again."];
      render();
    }
    db.collection("cards").limit(1000).onSnapshot(function (snap) {
      S.cards = snap.docs.map(function (d) {
        var c = Object.assign({}, d.data() || {}); c.id = d.id;
        if (COLUMNS.every(function (x) { return x.key !== c.status; })) c.status = "idea";
        return c;
      });
      S.loaded = true; settled(snap.metadata);
      render();
      seenReady();
      // Refresh an open card only when it changed, and never while its fields are
      // being edited: a re-render would drop the typed text and the focus.
      if (S.openId && !S.dirty) {
        var open = byId(S.openId);
        if (!open || JSON.stringify(open) !== S.openJson) renderDialog();
      }
    }, failed);
    db.doc("meta/board").onSnapshot(function (snap) {
      S.meta = snap.exists ? (snap.data() || {}) : {};
      render();
    }, function () { /* the board works without its meta document */ });
  }
  start();
})();
</script>
